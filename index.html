<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downtown Live</title>
  <!-- SDK CDN Bağlantısı -->
  <script src="https://phone-gw.downtownrpg.com/api/sdk/0.2/child.umd.js"></script>
  <style>
    :root {
      --bg: #121212;
      --label: #ffffff;
      --label-2: #8e8e93;
      --accent: #007aff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--label);
      font: 15px/1.45 -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
      padding-bottom: 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
    }

    small {
      color: var(--label-2);
      font-size: 13px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--label);
      padding: 0 12px;
      font-size: 15px;
      outline: none;
    }

    button {
      background: var(--accent);
      color: #ffffff;
      border: 0;
      border-radius: 12px;
      min-height: 44px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    button.danger {
      background: #ff3b30;
      color: #ffffff;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--label-2);
      color: #fff;
      text-transform: uppercase;
    }

    .badge.active {
      background: #34c759;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Downtown Live</h1>
      <small id="char-info">Yükleniyor…</small>
    </div>
    <span id="status-badge" class="badge">Çevrimdışı</span>
  </header>

  <!-- Yayın Başlatma Bölümü -->
  <section class="card">
    <h2>Yayın Başlat</h2>
    <input type="text" id="stream-title" placeholder="Yayın başlığı..." />
    <button id="btn-start">Canlı Yayın Başlat</button>
  </section>

  <!-- Yayın İzleme Bölümü -->
  <section class="card">
    <h2>Yayın İzle</h2>
    <input type="text" id="watch-id" placeholder="Yayın (Broadcast) ID..." />
    <button id="btn-watch" class="secondary">Yayına Katıl</button>
    <button id="btn-leave" class="danger" style="display: none;">Yayından Ayrıl</button>
  </section>

  <script>
    var phone = PhoneSDK.createPhoneSDK();

    // 1. Tema ve Karakter Bilgisi Yükleme
    phone.whenReady().then(function (ctx) {
      var r = document.documentElement.style;
      if (ctx.theme) {
        r.setProperty("--label",   ctx.theme.label);
        r.setProperty("--label-2", ctx.theme.secondaryLabel);
        r.setProperty("--bg",      ctx.theme.background);
        r.setProperty("--accent",  ctx.theme.accent);
      }
      document.getElementById("char-info").textContent = "Karakter #" + ctx.characterId;
    }).catch(function (err) {
      console.error("SDK Yükleme Hatası:", err);
    });

    // 2. Canlı Yayın Başlatma
    document.getElementById("btn-start").onclick = async function () {
      var title = document.getElementById("stream-title").value.trim() || "Canlı Yayın";

      try {
        var broadcast = await phone.live.startBroadcast({ title: title });
        document.getElementById("status-badge").textContent = "YAYINDA";
        document.getElementById("status-badge").classList.add("active");
        
        alert("Yayın Başladı!\nYayın ID: " + broadcast.broadcastId);
      } catch (e) {
        alert("Hata: " + (e.code || "Yayın başlatılamadı"));
      }
    };

    // 3. Yayına Katılma
    document.getElementById("btn-watch").onclick = async function () {
      var broadcastId = document.getElementById("watch-id").value.trim();
      if (!broadcastId) {
        alert("Lütfen bir Broadcast ID girin.");
        return;
      }

      try {
        await phone.live.watch({ broadcastId: broadcastId });

        document.getElementById("btn-watch").style.display = "none";
        document.getElementById("btn-leave").style.display = "block";
        document.getElementById("status-badge").textContent = "İZLENİYOR";
        document.getElementById("status-badge").classList.add("active");
      } catch (e) {
        alert("Hata: " + (e.code || "Yayına katılanamadı"));
      }
    };

    // 4. Yayından Ayrılma
    document.getElementById("btn-leave").onclick = async function () {
      try {
        await phone.live.leave();

        document.getElementById("btn-watch").style.display = "block";
        document.getElementById("btn-leave").style.display = "none";
        document.getElementById("status-badge").textContent = "Çevrimdışı";
        document.getElementById("status-badge").classList.remove("active");
      } catch (e) {
        alert("Hata: " + (e.code || "Ayrılma başarısız"));
      }
    };
  </script>
</body>
</html>
