<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownLive</title>
  <!-- Downtown Phone SDK -->
  <script src="https://phone-gw.downtownrpg.com/api/sdk/0.2/child.umd.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2a2a2a;
      --label: #ffffff;
      --label-secondary: #aaa;
      --accent: #9c27b0;
      --accent-hover: #7b1fa2;
      --danger: #d32f2f;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 48px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--card-bg);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-weight: 800;
      color: var(--accent);
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .char-badge {
      font-size: 12px;
      color: var(--label-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .status-bar {
      background: var(--danger);
      color: white;
      padding: 10px 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }

    .status-bar button {
      width: auto;
      padding: 6px 12px;
      margin: 0;
      font-size: 12px;
    }

    .tabs {
      display: flex;
      background: #181818;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      background: var(--card-bg);
      border: none;
      color: var(--label-secondary);
      font-size: 15px;
      font-weight: 600;
    }

    .tab.active {
      background: #2a2a2a;
      color: var(--label);
      border-bottom: 3px solid var(--accent);
    }

    .content {
      padding: 16px;
      flex: 1;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    h3 {
      font-size: 15px;
      margin-bottom: 12px;
      color: var(--label-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--label);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      min-height: 44px;
      padding: 0 16px;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.danger {
      background: var(--danger);
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .stream-card {
      background: var(--card-bg);
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stream-title {
      font-weight: bold;
      font-size: 15px;
    }

    .stream-meta {
      font-size: 12px;
      color: var(--label-secondary);
    }

    .no-streams {
      text-align: center;
      color: var(--label-secondary);
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">DownLive</div>
    <div id="charInfo" class="char-badge">Bağlanıyor...</div>
  </div>

  <div id="statusBar" class="status-bar">
    <span id="statusText">● YAYINDASINIZ</span>
    <button onclick="stopStream()" class="danger">Yayın Bitir</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('discover')">Keşfet</button>
    <button class="tab" onclick="switchTab('panel')">Yayın Paneli</button>
  </div>

  <div class="content">
    <div id="discoverPanel" class="panel active">
      <h3>Aktif Canlı Yayınlar</h3>
      <div id="streamsList">
        <div class="no-streams">Canlı yayınlar yükleniyor...</div>
      </div>
    </div>

    <div id="panelPanel" class="panel">
      <h3>Yayın Bilgileri</h3>
      <div class="form-group">
        <input type="text" id="streamTitle" placeholder="Yayın Başlığı">
        <input type="text" id="streamAuthor" placeholder="Yayıncı Adı (Karakter)">
        <input type="text" id="streamCategory" placeholder="Kategori (ör. Sohbet, Müzik)">
        <button id="btnStartStream" onclick="startStream()">Yayını Başlat</button>
      </div>
    </div>
  </div>

  <script>
    // Vercel içindeki API endpoint'i (Tamamen göreceli yol)
    const API_BASE = "/api/streams";
    let currentStreamId = null;
    let pingInterval = null;
    let phoneSDK = null;

    document.addEventListener("DOMContentLoaded", function () {
      try {
        if (window.PhoneSDK) {
          phoneSDK = PhoneSDK.createPhoneSDK();
          phoneSDK.whenReady().then(function (ctx) {
            if (ctx.characterId) {
              document.getElementById("charInfo").textContent = "Karakter #" + ctx.characterId;
              document.getElementById("streamAuthor").value = "Karakter #" + ctx.characterId;
            }
            if (ctx.theme) {
              document.documentElement.style.setProperty('--bg', ctx.theme.background || '#121212');
              document.documentElement.style.setProperty('--label', ctx.theme.label || '#ffffff');
              document.documentElement.style.setProperty('--accent', ctx.theme.accent || '#9c27b0');
            }
          }).catch(err => console.log("SDK hazır hatası:", err));
        } else {
          document.getElementById("charInfo").textContent = "Web Modu";
        }
      } catch (e) {
        document.getElementById("charInfo").textContent = "Web Modu";
      }

      loadStreams();
      setInterval(loadStreams, 4000);
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      if (tabName === 'discover') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('discoverPanel').classList.add('active');
        loadStreams();
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('panelPanel').classList.add('active');
      }
    }

    function loadStreams() {
      fetch(API_BASE)
      .then(res => res.json())
      .then(streams => {
        const listDiv = document.getElementById('streamsList');
        if (!streams || streams.length === 0) {
          listDiv.innerHTML = '<div class="no-streams">Şu an aktif canlı yayın bulunmuyor</div>';
          return;
        }

        listDiv.innerHTML = streams.map(s => `
          <div class="stream-card">
            <div class="stream-info">
              <div class="stream-title">${escapeHtml(s.title)} ${s.id === currentStreamId ? '<small>(Siz)</small>' : ''}</div>
              <div class="stream-meta">${escapeHtml(s.author || 'Yayıncı')} • ${escapeHtml(s.category || 'Genel')}</div>
            </div>
            ${s.id !== currentStreamId ? `
              <button class="secondary" style="width: auto; min-height: 36px; font-size: 12px;" onclick="watchStream('${s.id}')">Katıl</button>
            ` : ''}
          </div>
        `).join('');
      })
      .catch(err => {
        console.error("Yayınlar yüklenemedi:", err);
      });
    }

    async function startStream() {
      const title = document.getElementById('streamTitle').value.trim();
      const author = document.getElementById('streamAuthor').value.trim() || 'Yayıncı';
      const category = document.getElementById('streamCategory').value.trim() || 'Genel';

      if (!title) {
        alert('Lütfen bir yayın başlığı girin!');
        return;
      }

      currentStreamId = 'stream_' + Math.floor(Math.random() * 1000000);

      if (phoneSDK && phoneSDK.live) {
        try {
          await phoneSDK.live.startBroadcast({ title: title });
        } catch (e) {
          console.warn("Phone SDK Broadcast hatası:", e);
        }
      }

      fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentStreamId, title, author, category })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('statusBar').style.display = 'flex';
          document.getElementById('statusText').innerText = `● YAYINDASINIZ: ${title}`;

          if (pingInterval) clearInterval(pingInterval);
          pingInterval = setInterval(() => {
            fetch(API_BASE, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: currentStreamId, isPing: true })
            }).catch(err => console.error("Ping hatası:", err));
          }, 3000);

          switchTab('discover');
        }
      })
      .catch(err => alert('Yayın başlatılamadı: ' + err));
    }

    async function watchStream(broadcastId) {
      if (phoneSDK && phoneSDK.live) {
        try {
          await phoneSDK.live.watch({ broadcastId: broadcastId });
        } catch (e) {
          alert("Yayına katılınamadı: " + (e.code || e.message || "Hata"));
        }
      } else {
        alert("Yayına katılınıyor ID: " + broadcastId);
      }
    }

    async function stopStream() {
      if (!currentStreamId) return;

      if (phoneSDK && phoneSDK.live) {
        try {
          await phoneSDK.live.leave();
        } catch (e) {
          console.warn("Phone SDK leave hatası:", e);
        }
      }

      fetch(`${API_BASE}?id=${currentStreamId}`, { method: 'DELETE' })
      .then(() => cleanupStream())
      .catch(() => cleanupStream());
    }

    function cleanupStream() {
      if (pingInterval) clearInterval(pingInterval);
      pingInterval = null;
      currentStreamId = null;
      document.getElementById('statusBar').style.display = 'none';
      loadStreams();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
